name: validar-site

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-site:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6
      - name: Validar site sem acessar a rede
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\VALIDAR_SITE.ps1
